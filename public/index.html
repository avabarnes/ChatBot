<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orbit</title>
  <meta name="description" content="Orbit is a friendly general-purpose AI chatbot.">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="/assets/robot.png" type="image/png">
  <link rel="stylesheet" href="/styles.css">
  <script>
    // Apply saved theme before paint to avoid a flash.
    try {
      var t = localStorage.getItem('orbit-theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#message">Skip to message box</a>

  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-dot" aria-hidden="true"></span>
        <h1>Orbit</h1>
        <span class="label">AI CHAT</span>
      </div>
      <div class="actions">
        <button type="button" class="btn btn-ghost" id="new-chat">
          <span aria-hidden="true">+</span> New chat
        </button>
        <button type="button" class="btn btn-icon" id="theme-toggle" aria-label="Switch to light theme" aria-pressed="false">
          <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </header>

    <main class="layout">
      <section class="scene" aria-label="Orbit the robot">
        <div class="scene-glow" aria-hidden="true"></div>
        <div class="scene-inner">
          <img class="robot" src="/assets/robot.png" width="386" height="386" alt="Orbit, a friendly pixel-art robot waving hello">
          <p class="bubble">Hey, I’m Orbit. What’s on your mind?</p>
        </div>
        <p class="label scene-tag">ORBIT // ONLINE</p>
      </section>

      <section class="chat" aria-label="Chat with Orbit">
        <div class="log" id="log" role="log" aria-live="polite" aria-relevant="additions" tabindex="0">
          <div class="welcome" id="welcome">
            <p class="label">TRY ASKING</p>
            <ul class="chips" id="chips" aria-label="Suggested questions"></ul>
          </div>
        </div>

        <form class="composer" id="composer" autocomplete="off">
          <label class="sr-only" for="message">Message Orbit</label>
          <textarea id="message" rows="1" maxlength="2000" placeholder="Ask anything…" enterkeyhint="send"></textarea>
          <div class="composer-row">
            <span class="label counter" id="counter" aria-live="off">0 / 2000</span>
            <button type="submit" class="btn btn-send" id="send">Send <span aria-hidden="true">→</span></button>
          </div>
        </form>
      </section>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
